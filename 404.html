<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | Espaço Vida Caruaru</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      margin: 0;
      background: var(--color-bg-main);
      color: var(--color-text-main);
      font-family: var(--font-body);
    }
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .nf-logo {
      height: 40px;
      width: auto;
      margin-bottom: 40px;
    }
    .nf-eyebrow {
      font-family: var(--font-subheading);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 13px;
      color: var(--color-accent);
      margin-bottom: 10px;
    }
    .nf-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 32px;
      color: var(--color-primary-dark);
      margin: 0 0 16px;
    }
    .nf-desc {
      max-width: 420px;
      color: var(--color-text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 36px;
    }
    .nf-cta {
      display: inline-block;
      background: var(--color-primary);
      color: #fff;
      font-family: var(--font-subheading);
      font-weight: 600;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-md);
    }
    .nf-cta:hover {
      background: var(--color-primary-dark);
    }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <img class="nf-logo" src="/assets/img/logo-horizontal.png" alt="Espaço Vida Logo">
    <p class="nf-eyebrow">Página não encontrada</p>
    <h1 class="nf-title">Essa página não existe mais por aqui</h1>
    <p class="nf-desc">O link que você acessou mudou de endereço ou não está mais disponível. Volta pra home pra encontrar o que precisa.</p>
    <a class="nf-cta" href="/">Voltar para o início</a>
  </div>
</body>
</html>
